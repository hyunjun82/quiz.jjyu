name: IndexNow 즉시 인덱싱 핑

# 정답 데이터가 갱신될 때마다 네이버·빙에 "새 콘텐츠 있음"을 즉시 알림
on:
  push:
    paths:
      - 'data/answers/**'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 갱신 URL 목록 생성 후 IndexNow 핑
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          # ⚠️ 문제별 페이지(/quiz/{slug}/{today}/{n}/)를 반드시 포함시킨다.
          #    롱테일 검색어를 실제로 잡는 건 이 페이지들인데 여태 한 번도 안 알렸다.
          URLS=$(TODAY=$TODAY node -e "
            const fs = require('fs');
            const q = require('./data/quizzes.json').quizzes;
            const today = process.env.TODAY;
            const urls = ['https://quiz.jjyu.co.kr/'];
            let data = { answers: {} };
            try { data = JSON.parse(fs.readFileSync('./data/answers/' + today + '.json', 'utf8')); } catch {}
            for (const x of q) {
              urls.push('https://quiz.jjyu.co.kr/quiz/' + x.slug + '/');
              urls.push('https://quiz.jjyu.co.kr/quiz/' + x.slug + '/' + today + '/');
              const items = (data.answers || {})[x.slug] || [];
              items.forEach((_, i) => {
                urls.push('https://quiz.jjyu.co.kr/quiz/' + x.slug + '/' + today + '/' + (i + 1) + '/');
              });
            }
            console.log(JSON.stringify(urls));
          ")
          echo "핑 대상 URL: $(node -e 'console.log(JSON.parse(process.argv[1]).length)' "$URLS")개"
          cat > payload.json <<EOF
          {
            "host": "quiz.jjyu.co.kr",
            "key": "a602f498b33460cda8275cccdab72820",
            "keyLocation": "https://quiz.jjyu.co.kr/a602f498b33460cda8275cccdab72820.txt",
            "urlList": $URLS
          }
          EOF
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @payload.json -w "\nHTTP %{http_code}\n"
