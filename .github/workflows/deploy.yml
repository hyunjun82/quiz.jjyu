name: deploy

# 사이트 빌드·배포를 Cloudflare Workers Builds 대신 GitHub Actions 에서 한다 (2026-09-14).
#
# 왜: Cloudflare 무료 플랜의 빌드 한도는 월 3,000"분"인데, 9/1~14 에 2,147분을 썼다.
#     빌드 하나가 6분(초기화 대기 4분 + 실제 빌드 2분)이라 하루 25회면 150분 — 9/19~20 에
#     한도가 끝나고 그 뒤 월말까지 사이트 갱신이 통째로 멈춘다.
#     이 저장소는 공개 저장소라 GitHub Actions 는 분 제한이 없다. 여기서 `next build` 한 뒤
#     `wrangler deploy` 로 out/ 을 직접 올리면 Cloudflare 빌드 분을 한 푼도 안 쓴다.
#
# 준비(사장님이 한 번만): GitHub 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN   — Cloudflare 대시보드 → 내 프로필 → API 토큰 → "Cloudflare Workers 편집" 템플릿
#   CLOUDFLARE_ACCOUNT_ID  — d2e4e8fa6127e6e2ba40e48fe715aeef (대시보드 계정 정보에 표시되는 값)
# 를 넣는다. 둘 중 하나라도 없으면 이 워크플로는 배포 단계를 건너뛰고 로그에 이유를 남긴다.
#
# 그 다음 Cloudflare 쪽 자동 빌드(Git 연결)를 끊어야 이중 빌드가 안 된다:
#   Workers & Pages → quiz-jjyu → 설정 → 빌드 → Git 저장소 연결 해제 (또는 Build watch paths 에서 전부 제외)

on:
  push:
    branches: [main]
    paths:
      - 'data/answers/**'
      - 'data/quizzes.json'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}
  # 안전망: 어떤 이유로든 호출이 빠져도 30분 안에는 최신 main 이 사이트에 올라간다.
  # (2026-09-14 실측: 코드 교체 직전에 시작된 긴 수집 job 이 옛 코드로 15:41·15:46 정답을 푸시했는데
  #  옛 코드엔 배포 호출이 없어 사이트에 안 올라갔다. 공개 저장소라 Actions 분은 무제한이므로 비용 없음.)
  schedule:
    - cron: '*/30 * * * *'

# 몇 초 간격으로 데이터 커밋이 연달아 오면 앞선 빌드는 취소하고 마지막 것만 배포한다.
# 결과물은 항상 최신 커밋 기준이므로 중간 커밋을 건너뛰어도 잃는 내용은 없다.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 빌드 (next build → out/)
        run: npm run build

      - name: 배포 (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜀 (빌드는 성공)"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          echo "배포 완료: $(TZ=Asia/Seoul date '+%F %H:%M') KST"
