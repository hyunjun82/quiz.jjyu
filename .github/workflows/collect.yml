name: 실시간 정답 수집

# ── 설계 의도 ────────────────────────────────────────────────────────
# "5분마다 무작정 훑기"가 아니다. 각 퀴즈의 공개 시각(releaseTimes)을 알고 있으니
# 그 시각에만 붙어서 30초 간격으로 감시하다가 뜨는 즉시 커밋·푸시한다.
#
# 감시 블록(스크립트가 quizzes.json에서 자동 계산, 하루 7개 · 399분 = 28%):
#   KST 23:58~00:25 (27분, 퀴즈 12개)   ← 자정 발행이 절반
#   KST 07:58~09:25 (87분, 퀴즈  3~4개)
#   KST 09:58~11:25 (87분, 퀴즈  4개)
#   KST 11:58~12:55 (57분, 퀴즈  3개)
#   KST 13:58~14:25 (27분, 퀴즈  1개)
#   KST 18:58~19:25 (27분, 퀴즈  1개)
#   KST 19:58~21:25 (87분, 퀴즈  3개)
# 나머지 17시간은 아무것도 안 돈다.
#
# ⚠️ 왜 블록 시작 정각이 아니라 "한 시간 전부터" 알람을 거는가
#   이 저장소 실측 결과 GitHub Actions 예약 cron은 요청 대비 약 12%만 실행된다
#   (4.17일간 880회 예약 → 실제 111회, 시간당 약 1.5회). 정각 한 번만 걸면
#   대부분 그냥 안 뜬다. 그래서 블록 시작 전 한 시간 동안 5분 간격으로 알람을 촘촘히
#   깔아두고(12발), 그중 실제로 깨어난 아무 job 하나가 블록 시작까지 잠들었다가
#   구간 전체를 지킨다. 12발 중 1발만 살아도 그 블록은 커버된다.
#
#   concurrency group 덕분에 여러 발이 살아나도 동시에 돌지 않는다.
#   블록 안의 퀴즈를 전부 수집하면 스크립트가 남은 시간을 버리고 조기 종료한다.
#
# 저장소가 public이라 Actions 사용량 제한·과금이 없다.

on:
  schedule:
    # 각 블록 시작 직전 한 시간(UTC). KST = UTC + 9.
    #   UTC 14시 → KST 23:00~23:55  (블록 23:58)
    #   UTC 22시 → KST 07:00~07:55  (블록 07:58)
    #   UTC  0시 → KST 09:00~09:55  (블록 09:58)
    #   UTC  2시 → KST 11:00~11:55  (블록 11:58)
    #   UTC  4시 → KST 13:00~13:55  (블록 13:58)
    #   UTC  9시 → KST 18:00~18:55  (블록 18:58)
    #   UTC 10시 → KST 19:00~19:55  (블록 19:58)
    - cron: '*/5 0,2,4,9,10,14,22 * * *'
    # 공개 시각을 모르는 퀴즈(cashwalk, kakaopay, auction)와 놓친 것 회수용 스윕.
    # 블록 밖이면 스크립트가 한 바퀴만 돌고 수십 초 만에 끝난다.
    - cron: '0 */2 * * *'
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  # 감시 루프 도중에 죽이면 안 되므로 취소하지 않고 큐에 쌓는다.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 최악: KST 07:00에 깨어나 07:58까지 58분 대기 + 09:25까지 감시 = 145분.
    # 스크립트 자체가 MAX_MINUTES(165분)에서 스스로 정리하므로 그보다 조금 길게 둔다.
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          # 스크립트가 실행 중에 fetch/reset 후 push 하므로 얕은 클론이면 곤란하다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 정답 수집 · 발견 즉시 발행
        env:
          AUTO_PUSH: '1' # 감시 도중 발견하면 바로 커밋·푸시 (다음 주기까지 안 기다림)
          POLL_SECONDS: '30' # 블록 안에서의 감시 간격
          LEAD_MINUTES: '70' # 블록이 이 시간 안에 오면 잠들어 기다린다
          MAX_MINUTES: '165' # job 하나의 자체 상한
        run: node scripts/collect.mjs

      - name: 누락분 마무리 커밋
        # 스크립트가 중간에 실패하거나 AUTO_PUSH가 놓친 변경이 남아 있으면 여기서 건진다.
        #
        # continue-on-error 인 이유: 이 저장소는 이 워크플로 말고도 CCR 트리거가 같은
        # 파일을 민다. 경합으로 push가 한 번 거절되는 건 정상이고 다음 주기가 곧바로
        # 다시 시도한다. 그걸 빨간 X로 만들면 알림이 늘 켜져 있게 되고, 그러면
        # healthcheck.yml의 빨간 X(= 진짜 장애)가 묻혀버린다.
        if: always()
        continue-on-error: true
        run: |
          git config user.name "quizday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/answers/
          if git diff --cached --quiet; then
            echo "남은 변경 없음"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%m/%d %H:%M') 정답 업데이트 (마무리)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            if git push origin HEAD:main; then
              echo "푸시 성공 (시도 $i)"
              exit 0
            fi
            sleep 5
          done
          echo "푸시 실패 — 다음 주기에서 재시도됨"
